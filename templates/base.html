<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AlgoTest{% endblock %} · AlgoTest</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">A</span> AlgoTest</a>
    <nav><a href="/">Dashboard</a><a href="https://github.com/" target="_blank" rel="noreferrer">GitHub</a></nav>
  </header>
  <main class="container">{% block content %}{% endblock %}</main>
  <footer class="footer">AlgoTest · Practice deliberately. Test thoroughly.</footer>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
